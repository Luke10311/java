spring.application.name=springBootTest

# 激活的环境：dev（端口 8080，正好对上 Vue 的 Vite 代理）
spring.profiles.active=dev

# ===================== 数据源：本地 MySQL =====================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/meiying_shenbu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ===================== MyBatis-Plus =====================
# 表字段下划线 -> 实体驼峰（created_at -> createdAt）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 把执行的 SQL 打到控制台，调接口时方便核对
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.banner=false

# ===================== 登录令牌 JWT =====================
# 注意：HS256 要求密钥不少于 32 字节，改短了启动会直接报错
myss.jwt.secret=meiying-shenbu-secret-key-2026-!!
# 令牌有效期（小时）
myss.jwt.expire-hours=24

# ===================== 日志 =====================
logging.level.root=info
logging.level.com.fenglin.springboottest=info
# 运行日志落盘位置（相对项目启动目录）
logging.file.name=log/xx.log
# 控制台格式
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{50}.%M %L - %m%n
# 文件格式
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{50}.%M %L - %m%n
